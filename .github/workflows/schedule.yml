name: Python Learning Journey Scheduler

on:
  schedule:
    - cron: "17 10 13 9 *"
      timezone: "Asia/Kolkata"
    - cron: "23 14 16 9 *"
      timezone: "Asia/Kolkata"
    - cron: "37 18 18 9 *"
      timezone: "Asia/Kolkata"
    - cron: "41 21 20 9 *"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scheduled-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch scheduled content
        run: git fetch origin scheduled-content

      - name: Select folder
        id: select
        shell: bash
        run: |
          TODAY=$(date +%Y-%m-%d)

          case "$TODAY" in
            2026-09-13)
              echo "folder=Day 2 - Variable and Datatype" >> "$GITHUB_OUTPUT"
              echo "day=Day 2" >> "$GITHUB_OUTPUT"
              ;;
            2026-09-16)
              echo "folder=Day 3 - Strings" >> "$GITHUB_OUTPUT"
              echo "day=Day 3" >> "$GITHUB_OUTPUT"
              ;;
            2026-09-18)
              echo "folder=Day 4 - List and Tuples" >> "$GITHUB_OUTPUT"
              echo "day=Day 4" >> "$GITHUB_OUTPUT"
              ;;
            2026-09-20)
              echo "folder=Day 5 - Dictionary and Set" >> "$GITHUB_OUTPUT"
              echo "day=Day 5" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "No folder scheduled for today."
              exit 0
              ;;
          esac

      - name: Copy scheduled folder
        run: |
          FOLDER="${{ steps.select.outputs.folder }}"
          git archive origin/scheduled-content "$FOLDER" | tar -x

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.select.outputs.folder }}"
          git commit -m "Add ${{ steps.select.outputs.day }}" || echo "Nothing to commit"
          git push
